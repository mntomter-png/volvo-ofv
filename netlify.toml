[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Next.js-runtime for Netlify (App Router, API-ruter, middleware).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Netlify-funksjoner (datasynk-cron) ligger i netlify/functions.
[functions]
  node_bundler = "esbuild"

# Én offisiell adresse: send netlify-subdomenet til custom domain.
[[redirects]]
  from = "https://volvo-ofv.netlify.app/*"
  to = "https://app.biloversikt.com/:splat"
  status = 301
  force = true
