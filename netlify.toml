[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Next.js-runtime for Netlify (App Router, API-ruter, middleware).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Netlify-funksjoner (datasynk-cron) ligger i netlify/functions.
[functions]
  node_bundler = "esbuild"

# pg_cron poster til volvo-ofv.netlify.app/.netlify/functions/* —
# disse må IKKE 301’es (Authorization/POST brytes).
[[redirects]]
  from = "https://volvo-ofv.netlify.app/.netlify/*"
  to = "/.netlify/:splat"
  status = 200
  force = true

# Én offisiell adresse for mennesker: resten av netlify-subdomenet → custom domain.
[[redirects]]
  from = "https://volvo-ofv.netlify.app/*"
  to = "https://app.biloversikt.com/:splat"
  status = 301
  force = true
